name: 🛡️ Auto-Protect
# BOT GUARDIAN: en cada push, asegura que el sitio tenga TODO lo que
# necesita para ser seguro y funcional. Si algo falta, lo agrega.
# Si algo esta mal, lo arregla. Garantiza una baseline minima.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🛡️ Aplicar todas las protecciones
        id: fix
        run: |
          set +e
          FIXED=0

          # ============================================================
          # 1) Limpiar bytes basura/BOM al inicio de TODOS los HTML
          # ============================================================
          for f in *.html; do
            [ -f "$f" ] || continue
            first_byte=$(head -c 1 "$f" | xxd -p)
            if [ "$first_byte" != "3c" ]; then
              if [ "$first_byte" = "ef" ]; then
                tail -c +4 "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              else
                tail -c +2 "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              fi
              echo "🧹 Limpiado byte basura: $f"
              FIXED=$((FIXED+1))
            fi
          done

          # ============================================================
          # 2) INYECTAR security headers en TODOS los HTML que no los tengan
          # Esto incluye CSP (upgrade-insecure-requests), X-Content-Type-Options
          # y Referrer-Policy. Si el cliente sube un archivo sin esto, lo agregamos.
          # ============================================================
          for f in *.html; do
            [ -f "$f" ] || continue
            if ! grep -q "Content-Security-Policy" "$f"; then
              python3 << PYEOF
          with open("$f", "rb") as fp:
              content = fp.read().decode("utf-8", errors="ignore")
          security = '''    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
              <meta http-equiv="X-Content-Type-Options" content="nosniff">
              <meta name="referrer" content="strict-origin-when-cross-origin">
          '''.replace("              ", "    ")
          # Insertar despues del meta viewport (siempre presente)
          if '<meta name="viewport"' in content:
              content = content.replace(
                  content[content.find('<meta name="viewport"'):content.find('>', content.find('<meta name="viewport"'))+1],
                  content[content.find('<meta name="viewport"'):content.find('>', content.find('<meta name="viewport"'))+1] + "\n" + security.rstrip()
              )
              with open("$f", "w", encoding="utf-8", newline="") as fp:
                  fp.write(content)
              print(f"🔒 Security headers agregados: $f")
          PYEOF
              FIXED=$((FIXED+1))
            fi
          done

          # ============================================================
          # 3) FIX Mixed Content: HTTP del logo de WordPress -> local
          # ============================================================
          MIXED=$(grep -rl 'http://quinteros.co/wp-content/uploads/2015/10/quinteros-logotipo.png' --include='*.html' . 2>/dev/null | wc -l)
          if [ "$MIXED" -gt 0 ]; then
            # El cliente usa logos/logo.png, lo respetamos
            LOGO_PATH="logos/logo.png"
            [ -f "logos/quinteros-logo.png" ] && [ ! -f "logos/logo.png" ] && LOGO_PATH="logos/quinteros-logo.png"
            find . -name "*.html" -not -path "./.github/*" -exec sed -i "s|http://quinteros.co/wp-content/uploads/2015/10/quinteros-logotipo.png|$LOGO_PATH|g" {} +
            echo "🌐 Mixed Content arreglado en $MIXED archivos"
            FIXED=$((FIXED+MIXED))
          fi

          # ============================================================
          # 4) Garantizar .nojekyll VACIO (con contenido rompe Pages)
          # ============================================================
          if [ ! -f ".nojekyll" ] || [ -s ".nojekyll" ]; then
            > .nojekyll
            echo "📄 .nojekyll vaciado/creado"
            FIXED=$((FIXED+1))
          fi

          # ============================================================
          # 5) Garantizar CNAME = ingfedericolopez.com
          # ============================================================
          if [ ! -f "CNAME" ] || ! grep -q "ingfedericolopez.com" CNAME; then
            echo "ingfedericolopez.com" > CNAME
            echo "🌍 CNAME restaurado"
            FIXED=$((FIXED+1))
          fi

          # ============================================================
          # 6) Eliminar archivos legacy peligrosos (HTTP, sin .legacy)
          # ============================================================
          if [ -f "quinteros_home.html" ]; then
            rm -f quinteros_home.html
            echo "🗑️ Eliminado quinteros_home.html (legacy con Mixed Content)"
            FIXED=$((FIXED+1))
          fi

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo ""
          echo "📊 TOTAL DE ARREGLOS: $FIXED"

      - name: 💾 Commit & push
        if: steps.fix.outputs.fixed != '0'
        run: |
          git config user.name "Auto-Protect Bot"
          git config user.email "bot@quinteros.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🛡️ Auto-Protect: aplicar baseline de seguridad y reparaciones

          Arreglos aplicados: ${{ steps.fix.outputs.fixed }}
          - Security headers (CSP, X-Content-Type, Referrer)
          - Mixed Content fix (HTTP -> local)
          - .nojekyll vacio
          - CNAME correcto
          - Limpieza de bytes basura
          - Eliminacion de archivos legacy"
            git push
            echo "✅ Cambios protegidos publicados"
          fi

      - name: 📋 Summary
        run: |
          echo "### 🛡️ Auto-Protect Report" >> $GITHUB_STEP_SUMMARY
          echo "Arreglos aplicados: **${{ steps.fix.outputs.fixed }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Sitio publicado: https://ingfedericolopez.com/" >> $GITHUB_STEP_SUMMARY
