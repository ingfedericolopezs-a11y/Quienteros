name: 🛡️ Auto-Protect
# Robot que repara errores comunes en cada push a main.
# Permite al cliente editar libremente sin romper el sitio.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Auto-fix issues
        id: fix
        run: |
          set +e
          FIXED=0

          # 1) Limpiar "?" o bytes basura al inicio de HTML
          for f in *.html; do
            [ -f "$f" ] || continue
            first_byte=$(head -c 1 "$f" | xxd -p)
            if [ "$first_byte" != "3c" ]; then
              if [ "$first_byte" = "ef" ]; then
                tail -c +4 "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              else
                tail -c +2 "$f" > "${f}.tmp" && mv "${f}.tmp" "$f"
              fi
              echo "Limpiado byte basura en $f"
              FIXED=$((FIXED+1))
            fi
          done

          # 2) Garantizar .nojekyll
          if [ ! -f ".nojekyll" ]; then
            touch .nojekyll
            echo "Creado .nojekyll"
            FIXED=$((FIXED+1))
          fi

          # 3) Garantizar CNAME
          if [ ! -f "CNAME" ]; then
            echo "ingfedericolopez.com" > CNAME
            echo "Recreado CNAME"
            FIXED=$((FIXED+1))
          fi

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo "Total arreglos: $FIXED"

      - name: Commit arreglos
        if: steps.fix.outputs.fixed != '0'
        run: |
          git config user.name "Auto-Protect Bot"
          git config user.email "bot@quinteros.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🛡️ Auto-fix: corregir errores comunes del push anterior"
            git push
          fi
