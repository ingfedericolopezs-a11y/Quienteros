name: 🛡️ Auto-Protect
# BOT GUARDIAN: en cada push asegura el sitio.
# Inyecta security headers, repara Mixed Content, mantiene .nojekyll/CNAME.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  protect:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Aplicar protecciones
        id: fix
        run: |
          set +e
          FIXED=0

          # 1) Limpiar bytes basura/BOM al inicio
          for f in *.html; do
            [ -f "$f" ] || continue
            FB=$(head -c 1 "$f" | xxd -p)
            if [ "$FB" != "3c" ]; then
              if [ "$FB" = "ef" ]; then
                tail -c +4 "$f" > "$f.t" && mv "$f.t" "$f"
              else
                tail -c +2 "$f" > "$f.t" && mv "$f.t" "$f"
              fi
              echo "Cleaned: $f"
              FIXED=$((FIXED+1))
            fi
          done

          # 2) Inyectar security headers donde falten (usando sed con marca)
          for f in *.html; do
            [ -f "$f" ] || continue
            if ! grep -q "Content-Security-Policy" "$f"; then
              # Insertar 3 meta tags despues del viewport
              sed -i 's|<meta name="viewport"[^>]*>|&\n    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">\n    <meta http-equiv="X-Content-Type-Options" content="nosniff">\n    <meta name="referrer" content="strict-origin-when-cross-origin">|' "$f"
              echo "Security headers added: $f"
              FIXED=$((FIXED+1))
            fi
          done

          # 3) Mixed Content: HTTP del logo de WordPress a local
          LOGO_PATH="logos/logo.png"
          [ -f "logos/logo.svg" ] && LOGO_PATH="logos/logo.svg"
          [ ! -f "logos/logo.png" ] && [ ! -f "logos/logo.svg" ] && [ -f "logos/quinteros-logo.png" ] && LOGO_PATH="logos/quinteros-logo.png"
          MIXED=$(grep -rl 'http://quinteros.co/wp-content/uploads/2015/10/quinteros-logotipo.png' --include='*.html' . 2>/dev/null | wc -l)
          if [ "$MIXED" -gt 0 ]; then
            find . -name "*.html" -not -path "./.github/*" -exec sed -i "s|http://quinteros.co/wp-content/uploads/2015/10/quinteros-logotipo.png|$LOGO_PATH|g" {} +
            echo "Mixed Content fixed in $MIXED files"
            FIXED=$((FIXED+MIXED))
          fi

          # 4) .nojekyll vacio
          if [ ! -f ".nojekyll" ] || [ -s ".nojekyll" ]; then
            > .nojekyll
            echo ".nojekyll fixed"
            FIXED=$((FIXED+1))
          fi

          # 5) CNAME correcto
          if [ ! -f "CNAME" ] || ! grep -q "ingfedericolopez.com" CNAME; then
            echo "ingfedericolopez.com" > CNAME
            echo "CNAME fixed"
            FIXED=$((FIXED+1))
          fi

          # 6) Eliminar archivos legacy peligrosos
          if [ -f "quinteros_home.html" ]; then
            rm -f quinteros_home.html
            echo "Removed quinteros_home.html"
            FIXED=$((FIXED+1))
          fi

          echo "fixed=$FIXED" >> $GITHUB_OUTPUT
          echo "TOTAL: $FIXED"

      - name: Commit & push
        if: steps.fix.outputs.fixed != '0'
        run: |
          git config user.name "Auto-Protect Bot"
          git config user.email "bot@quinteros.local"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "🛡️ Auto-Protect: aplicar baseline ($FIXED arreglos)"
            git push
          fi
        env:
          FIXED: ${{ steps.fix.outputs.fixed }}

      - name: Summary
        run: |
          echo "### Auto-Protect" >> $GITHUB_STEP_SUMMARY
          echo "Arreglos: ${{ steps.fix.outputs.fixed }}" >> $GITHUB_STEP_SUMMARY
          echo "Sitio: https://ingfedericolopez.com/" >> $GITHUB_STEP_SUMMARY
